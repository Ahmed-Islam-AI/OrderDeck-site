<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- OrderDeck favicon: the fanned-deck mark on the console amber badge. Platform-facing
       only — the customer PWA icon stays tenant-neutral (customer/scripts/gen-icons.mjs). -->
  <defs>
    <linearGradient id="od-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <mask id="od-gap">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="8.9" y="3.9" width="14.2" height="20.2" rx="4.1" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#od-badge)"/>
  <g fill="#fff" transform="translate(16 16) scale(0.66) translate(-16 -15)">
    <g opacity=".5" mask="url(#od-gap)">
      <rect x="10" y="5" width="12" height="18" rx="3" transform="rotate(-21 16 26)"/>
      <rect x="10" y="5" width="12" height="18" rx="3" transform="rotate(21 16 26)"/>
    </g>
    <rect x="10" y="5" width="12" height="18" rx="3"/>
  </g>
</svg>
