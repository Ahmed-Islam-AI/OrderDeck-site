# Push to main -> build static site -> publish to GitHub Pages.
# One-time: repo Settings > Pages > Source: "GitHub Actions". Then point your domain's DNS at GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Fails the deploy while site.config.ts still has placeholders; writes out/CNAME + out/.nojekyll.
      - run: npm run check:deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: pages
        uses: actions/deploy-pages@v4
